{% extends 'layouts/base.html' %}

{% block title %} Assistance - Signal Archive {% endblock %}

{% block content %}

<!-- Assistance Command Center -->
<div class="flex h-[calc(100vh-64px)] -m-6 md:-m-10 overflow-hidden theme-bg">

    <!-- Middle Column: The Assistance Stream -->
    <div class="flex-1 flex flex-col relative bg-white theme-bg">
        <!-- The Chat Thread -->
        <div id="forensic-thread" class="flex-1 overflow-y-auto p-5 space-y-12 custom-scrollbar pb-32">
            <div class="flex flex-col items-center justify-center h-full opacity-10 text-center">
                <div
                    class="w-10 h-10 mb-4 border border-dashed theme-border rounded-full flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                        </path>
                    </svg>
                </div>
                <p class="text-[9px] font-bold uppercase tracking-[0.4em]">Assistance Standby</p>
            </div>
        </div>

        <!-- Conversational Input Hub -->
        {% include 'components/assistance_input.html' %}
    </div>

    <!-- Forensic Inspector: Real-time Analytics Sidebar -->
    {% include "components/forensic_inspector.html" %}
</div>

<!-- Modal Layers -->
{% include 'components/readmore_modal.html' %}

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    .message-bubble {
        animation: messageSlide 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes messageSlide {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .markdown-body {
        font-size: 13px;
        line-height: 1.6;
        text-align: left;
    }

    .markdown-body p {
        margin-bottom: 1em;
    }

    .markdown-body strong {
        font-weight: 600;
        color: #2563eb;
    }

    .typing-dot {
        animation: typingPulse 1.4s infinite;
    }

    @keyframes typingPulse {

        0%,
        100% {
            opacity: 0.2;
        }

        50% {
            opacity: 1;
        }
    }
</style>

<script src="/static/js/forensic_analytics.js"></script>
<script src="/static/js/chat_logic.js"></script>


{% endblock %}
