{% extends 'static/base.html' %}

{% block title %} Forensic Chat - Neural Forensic Suite {% endblock %}

{% block content %}

<!-- Forensic Command Center (3-Column Layout) -->
<div class="flex h-[calc(100vh-100px)] -m-6 md:-m-10 overflow-hidden theme-bg">
    
    <!-- Middle Column: The RAG Stream -->
    <div class="flex-1 flex flex-col border-r theme-border relative bg-gray-50/30 dark:bg-gray-900/10">
        <!-- Stream Header -->
        <header class="h-12 px-6 border-b theme-border flex items-center justify-between bg-white dark:bg-gray-900 z-10">
            <div class="flex items-center gap-2.5">
                <div class="w-1 h-3 bg-blue-600 rounded-full"></div>
                <h2 class="text-[9px] font-bold theme-text uppercase tracking-[0.2em]">Neural Intelligence</h2>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-1 h-1 bg-blue-500 rounded-full animate-pulse"></span>
                <span class="text-[8px] font-bold theme-text-sec opacity-60 uppercase tracking-widest">RAG Active</span>
            </div>
        </header>

        <!-- The Chat Thread (Gemini Style) -->
        <div id="forensic-thread" class="flex-1 overflow-y-auto p-6 space-y-12 custom-scrollbar pb-32">
            <div class="flex flex-col items-center justify-center h-full opacity-10 text-center">
                <div class="w-10 h-10 mb-4 border border-dashed theme-border rounded-full flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <p class="text-[9px] font-bold uppercase tracking-[0.4em]">Engine Standby</p>
            </div>
        </div>

        <!-- Conversational Input Hub (Command Palette Precision Style) -->
        <div class="mt-auto border-t theme-border bg-white dark:bg-gray-900 shrink-0 z-20">
            <!-- Mode Toggle (Local vs Global) -->
            <div class="max-w-2xl mx-auto w-full pt-4 px-6 flex justify-start">
                <div class="bg-gray-100 dark:bg-gray-800 p-1 rounded-full flex items-center gap-1 border theme-border">
                    <button id="mode-local" onclick="setMode('local')" 
                            class="px-4 py-1.5 rounded-full text-[9px] font-bold uppercase tracking-widest transition-all bg-blue-600 text-white shadow-sm">
                        Local Archive
                    </button>
                    <button id="mode-global" onclick="setMode('global')" 
                            class="px-4 py-1.5 rounded-full text-[9px] font-bold uppercase tracking-widest transition-all theme-text opacity-40 hover:opacity-100">
                        Global Assistant
                    </button>
                </div>
            </div>

            <div class="relative group max-w-2xl mx-auto w-full">
                <!-- Search Icon (Command Palette Style) -->
                <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                    <svg class="w-3.5 h-3.5 text-gray-400 group-focus-within:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <!-- Slim Command Input -->
                <input type="text" id="stream-query" 
                       class="w-full pl-12 pr-16 py-5 theme-bg theme-text text-sm border-none outline-none focus:ring-0 placeholder:theme-text placeholder:opacity-30 font-medium"
                       placeholder="Type to search or ask archive..." 
                       autocomplete="off"
                       onkeydown="if(event.key === 'Enter') executeStreamSearch()">
                
                <!-- Neural Pulsar Button (Circular, embedded) -->
                <div class="absolute right-4 inset-y-0 flex items-center">
                    <button id="exec-btn" onclick="executeStreamSearch()" 
                            class="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-700 active:scale-90 transition-all shadow-md">
                        <div id="exec-icon-send">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>
                        <div id="exec-icon-stop" class="hidden">
                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><rect width="14" height="14" x="5" y="5" rx="2"></rect></svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Sidebar: Analysis Inspector -->
    <div class="w-80 flex flex-col bg-white dark:bg-gray-900 shrink-0 overflow-y-auto custom-scrollbar border-l theme-border">
        <header class="h-12 px-6 border-b theme-border flex items-center shrink-0">
            <h2 class="text-[9px] font-bold theme-text uppercase tracking-[0.2em]">Forensic Inspector</h2>
        </header>
        <div id="inspector-content" class="p-6 space-y-8">
            <div class="flex flex-col items-center justify-center h-64 opacity-20 text-center">
                <p class="text-[9px] font-bold uppercase tracking-widest">Select segment for<br>deep analytics</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    .message-bubble {
        animation: messageSlide 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes messageSlide {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .markdown-body { font-size: 13px; line-height: 1.6; text-align: left; }
    .markdown-body p { margin-bottom: 1em; }
    .markdown-body strong { font-weight: 600; color: #2563eb; }
</style>

<script>
    async function executeStreamSearch() {
        const queryInput = document.getElementById('stream-query');
        const query = queryInput.value;
        if (!query.trim()) return;
        
        const thread = document.getElementById('forensic-thread');
        const btn = document.getElementById('exec-btn');
        const sendIcon = document.getElementById('exec-icon-send');
        const stopIcon = document.getElementById('exec-icon-stop');

        // Clear placeholder if first message
        if (thread.querySelector('.opacity-10')) thread.innerHTML = '';

        // Add User Message (Gemini Style - Right Aligned Bubble, Left Aligned Text)
        const userMsg = document.createElement('div');
        userMsg.className = 'flex flex-col items-end w-full message-bubble';
        userMsg.innerHTML = `
            <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm text-left">
                <p class="text-[13px] font-medium leading-relaxed">${query}</p>
            </div>
            <span class="text-[8px] font-bold theme-text-sec opacity-30 uppercase tracking-widest mt-1 mr-1">Investigator</span>
        `;
        thread.appendChild(userMsg);
        queryInput.value = '';
        thread.scrollTop = thread.scrollHeight;

        // Enter Loading State
        btn.classList.remove('bg-blue-600'); btn.classList.add('bg-gray-800');
        sendIcon.classList.add('hidden'); stopIcon.classList.remove('hidden');

        try {
            // 1. Retrieve Forensic Context
            const searchResponse = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
            const searchData = await searchResponse.json();
            
            // 2. Synthesize Intelligence (RAG)
            const synthResponse = await fetch('/api/synthesis', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ query: query, context_docs: searchData.results })
            });

            if (!synthResponse.ok) {
                const errData = await synthResponse.json();
                throw new Error(errData.detail || 'Neural Synthesis failed at the gateway.');
            }

            const synthData = await synthResponse.json();

            // Check for Internal Engine Errors returned as 200
            if (synthData.synthesis.includes('Neural Error') || synthData.synthesis.includes('Neural Core Error')) {
                showToast(synthData.synthesis, 'error');
            }

            // AI Response (Gemini Style - Left Aligned)
            const aiMsg = document.createElement('div');
            aiMsg.className = 'flex flex-col items-start w-full message-bubble';
            aiMsg.innerHTML = `
                <div class="flex items-center gap-2.5 mb-2 ml-1">
                    <div class="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>
                    <span class="text-[9px] font-bold theme-text-sec uppercase tracking-widest opacity-60">Neural Core Analysis</span>
                </div>
                <div class="theme-bg p-6 rounded-2xl rounded-tl-none border theme-border shadow-sm max-w-[95%] markdown-body theme-text">
                    ${marked.parse(synthData.synthesis)}
                    
                    ${searchData.results.length > 0 ? `
                        <div class="mt-8 pt-5 border-t theme-border">
                            <p class="text-[9px] font-bold theme-text-sec uppercase tracking-widest opacity-30 mb-4">Forensic Records Found</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${searchData.results.slice(0, 4).map(res => `
                                    <div class="p-3.5 rounded-xl bg-gray-50/50 dark:bg-gray-800/50 border theme-border cursor-pointer hover:border-blue-500 transition-all" onclick="inspectDocument(${res.id})">
                                        <div class="flex items-center justify-between mb-1.5">
                                            <span class="text-[8px] font-bold text-blue-600 uppercase tracking-widest">${res.tag}</span>
                                            <span class="text-[8px] theme-text-sec opacity-40">#${res.id}</span>
                                        </div>
                                        <p class="text-[11px] theme-text-sec line-clamp-2 opacity-70 leading-relaxed">${res.content}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            thread.appendChild(aiMsg);
            thread.scrollTop = thread.scrollHeight;
        } catch (error) {
            showToast(error.message || 'Synthesis failed.', 'error');
        } finally {
            btn.classList.add('bg-blue-600'); btn.classList.remove('bg-gray-800');
            sendIcon.classList.remove('hidden'); stopIcon.classList.add('hidden');
        }
    }

    async function inspectDocument(id) {
        const inspector = document.getElementById('inspector-content');
        inspector.innerHTML = `
            <div class="flex flex-col items-center justify-center h-64">
                <div class="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-[9px] font-bold uppercase tracking-widest mt-4 opacity-40">Inspecting #${id}...</p>
            </div>
        `;

        try {
            const response = await fetch(`/api/docs/${id}`);
            const data = await response.json();
            
            inspector.innerHTML = `
                <div class="space-y-8 message-bubble">
                    <section class="space-y-4">
                        <h4 class="text-[9px] font-bold theme-text-sec uppercase tracking-widest opacity-40">Thematic Matrices</h4>
                        <div class="grid grid-cols-1 gap-3">
                            <div class="p-3.5 rounded-xl border theme-border bg-blue-600/5">
                                <p class="text-[8px] font-bold text-blue-600 uppercase mb-1">LDA Topic</p>
                                <p class="text-xs theme-text font-medium">${data.lda_topic_label || 'Unlabeled'}</p>
                            </div>
                            <div class="p-3.5 rounded-xl border theme-border bg-purple-600/5">
                                <p class="text-[8px] font-bold text-purple-600 uppercase mb-1">BERT Context</p>
                                <p class="text-xs theme-text font-medium">${data.bert_topic_label || 'Unprocessed'}</p>
                            </div>
                        </div>
                    </section>
                    <section class="space-y-3 pt-4 border-t theme-border">
                        <h4 class="text-[9px] font-bold theme-text-sec uppercase tracking-widest opacity-40">Controls</h4>
                        <div class="flex flex-col gap-2">
                            <button onclick="refineWithAI(${data.id})" class="w-full py-2.5 bg-blue-600 text-white rounded-lg text-[10px] font-bold uppercase hover:bg-blue-700 transition-all">Neural Refine</button>
                            <a href="/show/${data.id}" class="w-full py-2.5 border theme-border theme-text rounded-lg text-[10px] font-bold uppercase hover:theme-bg-sec transition-all text-center">Full Report</a>
                            <button onclick="deleteDocument(${data.id})" class="w-full py-2.5 text-red-500 text-[10px] font-bold uppercase hover:bg-red-500/10 transition-all">Purge Record</button>
                        </div>
                    </section>
                </div>
            `;
        } catch (error) {
            showToast('Inspection failed', 'error');
        }
    }
</script>

{% endblock %}
