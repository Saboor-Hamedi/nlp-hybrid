<!-- Industrial Forensic Editor -->
<div id="editorModal" class="fixed inset-0 z-[100] bg-gray-900/30 backdrop-blur-md items-center justify-center p-6 hidden">
    <div class="bg-white theme-bg w-full max-w-xl rounded-[5px] shadow-[0_30px_70px_rgba(0,0,0,0.4)] border theme-border overflow-hidden flex flex-col editor-kinetic ring-1 ring-white/10">
        
        <!-- Precision Title Bar -->
        <header class="h-8 pl-5 pr-0 border-b theme-border flex items-center justify-between bg-gray-50/5 rounded-t-[5px] shrink-0">
            <div class="flex items-center gap-2.5">
                <div class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-pulse shadow-[0_0_8px_rgba(37,99,235,0.6)]"></div>
                <h2 id="editorTitle" class="text-[10px] font-bold theme-text tracking-wide opacity-80">Forensic refinement</h2>
            </div>
            <button onclick="toggleEditor()" class="h-8 w-10 flex items-center justify-center theme-text-sec hover:bg-red-500 hover:text-white active:scale-90 rounded-tr-[5px] transition-all duration-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </header>

        <!-- Editor Body -->
        <div class="p-6 space-y-4">
            <div class="space-y-1.5">
                <label class="text-[9px] font-bold theme-text-sec tracking-wide opacity-40">Neural instruction</label>
                <div class="relative">
                    <input id="editorPrompt" type="text" 
                           class="w-full bg-blue-600/5 theme-text px-4 py-2.5 rounded-lg border theme-border focus:border-blue-500/30 outline-none text-[12px] placeholder:opacity-30 transition-all disabled:opacity-50"
                           placeholder="Enter instruction (e.g. 'Summarize', 'Fix symbols', 'Extract logic')..."
                           onkeydown="if(event.key === 'Enter') refineCurrentContent()">
                    <div id="neuralActivity" class="absolute right-3 top-2.5 hidden items-center gap-2">
                        <div class="flex gap-0.5">
                            <div class="w-1 h-3 bg-blue-500 animate-[loading_1s_ease-in-out_infinite]"></div>
                            <div class="w-1 h-3 bg-blue-500 animate-[loading_1s_ease-in-out_infinite_0.2s]"></div>
                            <div class="w-1 h-3 bg-blue-500 animate-[loading_1s_ease-in-out_infinite_0.4s]"></div>
                        </div>
                    </div>
                    <div id="neuralPromptHint" class="absolute right-3 top-2.5 flex items-center gap-2 pointer-events-none">
                        <span class="text-[8px] font-bold theme-text-sec opacity-20 uppercase tracking-widest">⏎ to execute</span>
                    </div>
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-[9px] font-bold theme-text-sec tracking-wide opacity-40">Forensic workspace</label>
                <textarea id="editorContent" 
                    class="w-full h-72 theme-bg-sec theme-text p-5 rounded-lg border theme-border focus:border-blue-500/30 focus:ring-4 focus:ring-blue-500/5 outline-none text-[13px] leading-relaxed font-light resize-none custom-scrollbar transition-all duration-300 placeholder:opacity-20"
                    placeholder="Awaiting input..."></textarea>
            </div>
        </div>

        <!-- Footer Actions -->
        <footer class="px-6 pb-6 flex items-center justify-between">
            <div class="flex items-center gap-2">
            </div>
            <div class="flex items-center gap-3">
                <button id="editorSubmitBtn" onclick="saveDocument()" 
                        class="px-8 py-2 bg-blue-600 text-white rounded-[3px] text-[10px] font-bold tracking-wide hover:bg-blue-700 active:scale-95 transition-all duration-200 shadow-lg shadow-blue-500/20">
                    Update
                </button>
            </div>
        </footer>
    </div>
</div>

<style>
    .editor-kinetic {
        animation: editorSlide 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes editorSlide {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes loading {
        0%, 100% { height: 4px; opacity: 0.3; }
        50% { height: 12px; opacity: 1; }
    }
    .ghost-shimmer {
        background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.05), transparent);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    .custom-scrollbar::-webkit-scrollbar {
        width: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(37, 99, 235, 0.15);
        border-radius: 10px;
    }
</style>
