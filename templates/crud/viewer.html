<!-- High-Fidelity Forensic Viewer -->
<div id="viewerModal" class="fixed inset-0 z-[110] bg-gray-900/30 backdrop-blur-md items-center justify-center p-6 hidden">
    <div class="bg-white theme-bg w-full max-w-3xl rounded-xl shadow-[0_20px_60px_rgba(0,0,0,0.3)] border theme-border overflow-hidden flex flex-col modal-enter h-[85vh]">
        
        <!-- Precision Title Bar -->
        <header class="h-12 pl-6 pr-2 border-b theme-border flex items-center justify-between bg-gray-50/5 rounded-t-xl shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.4)]"></div>
                <h2 id="viewerTitle" class="text-[10px] font-bold theme-text uppercase tracking-[0.3em] opacity-60">Forensic Analysis View</h2>
            </div>
            <button onclick="toggleViewer()" class="h-10 w-10 flex items-center justify-center theme-text-sec hover:bg-red-500 hover:text-white active:scale-90 transition-all duration-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </header>

        <!-- Viewer Content -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-10 space-y-8">
            <!-- Header Meta -->
            <div class="flex items-center justify-between border-b theme-border pb-6">
                <div class="space-y-1">
                    <p id="viewerId" class="text-[10px] font-mono theme-text opacity-40">#ID_PLACEHOLDER</p>
                    <p id="viewerTimestamp" class="text-[9px] font-bold theme-text-sec uppercase tracking-widest opacity-60">Indexed at N/A</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="viewerLang" class="px-2 py-0.5 bg-blue-500/10 text-blue-500 text-[9px] font-bold rounded border border-blue-500/20 uppercase">EN</span>
                </div>
            </div>

            <!-- Content Body -->
            <div class="space-y-4">
                <h3 class="text-[10px] font-bold theme-text-sec uppercase tracking-[0.2em] opacity-40">Primary Document Content</h3>
                <div id="viewerBody" class="theme-text text-sm leading-relaxed font-light whitespace-pre-wrap"></div>
            </div>

            <!-- Neural Insight (RAG) -->
            <div id="viewerInsightPanel" class="mt-8 p-6 bg-blue-600/5 rounded-xl border border-blue-500/10 space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-1.5 bg-blue-600 rounded-full animate-pulse"></div>
                        <h4 class="text-[10px] font-bold theme-text uppercase tracking-widest">Neural Insight</h4>
                    </div>
                    <span id="viewerInsightStatus" class="text-[8px] font-bold text-blue-600/60 uppercase italic tracking-widest">Awaiting Analysis...</span>
                </div>
                <p id="viewerInsightContent" class="theme-text text-[12px] leading-relaxed opacity-70 italic font-light">
                    Initiating forensic synthesis...
                </p>
            </div>

            <!-- Neural Matrices -->
            <div class="grid grid-cols-2 gap-8 pt-8 border-t theme-border">
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-purple-500 rounded-full"></span>
                        <h4 class="text-[10px] font-bold theme-text uppercase tracking-widest">LDA Signature</h4>
                    </div>
                    <div id="viewerLdaTag" class="text-xs font-bold text-purple-500">N/A</div>
                    <div id="viewerLdaKeywords" class="flex flex-wrap gap-1.5"></div>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                        <h4 class="text-[10px] font-bold theme-text uppercase tracking-widest">BERT Contextual</h4>
                    </div>
                    <div id="viewerBertTag" class="text-xs font-bold text-indigo-500">N/A</div>
                    <div id="viewerBertKeywords" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="px-10 py-5 border-t theme-border bg-gray-50/5 flex justify-end">
            <button onclick="toggleViewer()" class="px-8 py-2 bg-blue-600 text-white rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/20">Acknowledge</button>
        </footer>
    </div>
</div>

<style>
    .modal-enter {
        animation: viewerPop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes viewerPop {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
